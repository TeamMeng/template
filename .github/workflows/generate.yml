name: generate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-nextest,cargo-generate,typos
      - name: Generate project from template
        run: |
          mkdir -p "$RUNNER_TEMP/generated"
          cargo generate --path . --name smoke --define authors=CI \
            --destination "$RUNNER_TEMP/generated" --silent
          test -f "$RUNNER_TEMP/generated/smoke/Cargo.toml"
          ! grep -Eq '\{\{(project-name|authors)\}\}' \
            "$RUNNER_TEMP/generated/smoke/Cargo.toml" \
            "$RUNNER_TEMP/generated/smoke/cliff.toml"
          test ! -e "$RUNNER_TEMP/generated/smoke/Cargo.lock"
          test ! -e "$RUNNER_TEMP/generated/smoke/.github/workflows/generate.yml"
          # prek's --all-files only sees tracked files
          git -C "$RUNNER_TEMP/generated/smoke" add -A
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ runner.temp }}/generated/smoke -> target"
      # Same hooks the generated project's own CI runs (see build.yml)
      - name: Verify generated project
        uses: j178/prek-action@v3.1.1
        with:
          working-directory: ${{ runner.temp }}/generated/smoke
          extra-args: --all-files --stage pre-push
