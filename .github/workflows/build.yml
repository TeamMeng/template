name: build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-nextest,typos
      - uses: Swatinem/rust-cache@v2
      # Runs every hook in prek.toml: hooks without `stages` also run in the
      # pre-push stage, so this covers the commit checks plus clippy and tests.
      - name: Run prek hooks
        uses: j178/prek-action@v3.1.1
        with:
          extra-args: --all-files --stage pre-push

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize template placeholders
        if: github.repository == 'TeamMeng/template'
        run: sed -i 's/{{project-name}}/template/g' cliff.toml
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
