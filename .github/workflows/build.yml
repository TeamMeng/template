name: build

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  build-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Normalize template placeholders
        if: github.repository == 'TeamMeng/template'
        run: |
          sed -i 's/{{project-name}}/template/g' Cargo.toml cliff.toml
          cargo generate-lockfile
      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-nextest,typos
      - uses: Swatinem/rust-cache@v2
      - name: Check typos
        run: typos
      - name: Check dependencies
        run: cargo deny check
      - name: Check code format
        run: cargo fmt --all -- --check
      - name: Lint rust sources
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Execute rust tests
        run: cargo nextest run --workspace --all-features

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,cargo-generate
      - name: Generate project from template
        run: |
          mkdir -p "$RUNNER_TEMP/generated"
          cargo generate --path . --name smoke --define authors=CI \
            --destination "$RUNNER_TEMP/generated" --silent
          test -f "$RUNNER_TEMP/generated/smoke/Cargo.toml"
          ! grep -Eq '\{\{(project-name|authors)\}\}' \
            "$RUNNER_TEMP/generated/smoke/Cargo.toml" \
            "$RUNNER_TEMP/generated/smoke/cliff.toml"
          test ! -e "$RUNNER_TEMP/generated/smoke/Cargo.lock"
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ runner.temp }}/generated/smoke -> target"
      - name: Verify generated project
        working-directory: ${{ runner.temp }}/generated/smoke
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --all-features -- -D warnings
          cargo nextest run --workspace --all-features

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-rust, generate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize template placeholders
        if: github.repository == 'TeamMeng/template'
        run: sed -i 's/{{project-name}}/template/g' cliff.toml
      - name: Generate a changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.git-cliff.outputs.content }}
