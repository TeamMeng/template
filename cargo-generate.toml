[template]
cargo_generate_version = ">=0.20.0"
# Files copied as-is, without Liquid substitution:
# - build.yml relies on GitHub's own `${{ }}` expression syntax
# - cargo-hook.sh matches the literal `{{project-name}}` placeholder text
exclude = [".github/workflows/build.yml", "scripts/cargo-hook.sh"]
# Kept out of generated projects (template bookkeeping only):
ignore = ["CHANGELOG.md", "Cargo.lock"]
